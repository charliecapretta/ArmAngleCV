# Included in nginx's server block. Do not change the managed proxy locations.
# Beanstalk already sets client_body_timeout here; redeclaring it prevents startup.
client_max_body_size 209780736; # 200 MiB file plus bounded multipart overhead
proxy_read_timeout 150s;
proxy_send_timeout 120s;

# Server-level limits inherit into Beanstalk's managed proxy location.
# Empty zone keys exclude unrelated endpoints without overriding proxy settings.
limit_req zone=frames burst=90 nodelay;
limit_req zone=uploads burst=2 nodelay;
limit_req zone=predictions burst=6 nodelay;
limit_req zone=api burst=20 nodelay;
limit_req_status 429;
error_page 429 = @rateLimited;
location @rateLimited {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    return 429 '{"error":"Too many requests. Please wait a minute and retry."}';
}
error_page 413 = @uploadTooLarge;
location @uploadTooLarge {
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-store, private" always;
    return 413 '{"error":"Choose an MP4 up to 200 MB."}';
}
