# http context. CloudFront-Viewer-Address is trustworthy ONLY with the origin
# restricted to CloudFront's VPC service security group, as required by the app.
# Strip the viewer port so a new TCP connection cannot reset a client's bucket.
map $http_cloudfront_viewer_address $clientBudgetKey {
    default $binary_remote_addr;
    ~^\[(?<viewerIpv6>[0-9a-fA-F:]+)\]:[0-9]+$ $viewerIpv6;
    ~^(?<viewerIpv4>[0-9.]+):[0-9]+$ $viewerIpv4;
}
map $uri $frameBudgetKey { default ""; /api/frame $clientBudgetKey; }
map $uri $uploadBudgetKey { default ""; /api/upload $clientBudgetKey; }
map $uri $predictBudgetKey { default ""; /api/predict-angle $clientBudgetKey; }
map $uri $apiBudgetKey {
    default "";
    /api/frame "";
    /api/upload "";
    /api/predict-angle "";
    ~^/api/ $clientBudgetKey;
}
limit_req_zone $frameBudgetKey zone=frames:10m rate=90r/s;
limit_req_zone $uploadBudgetKey zone=uploads:10m rate=2r/m;
limit_req_zone $predictBudgetKey zone=predictions:10m rate=2r/s;
limit_req_zone $apiBudgetKey zone=api:10m rate=10r/s;
